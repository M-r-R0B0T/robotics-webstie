<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ancalagon Robotics — Building Autonomous Intelligence</title>
  <meta name="description"
    content="Ancalagon Robotics is pioneering general-purpose humanoid robots with advanced embodied AI. Meet VISAGE — autonomy, redefined." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ═══════════ NAVIGATION ═══════════ -->
  <nav id="navbar" class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <img src="media/logo.png" alt="Ancalagon" class="logo-img" />
        <span class="logo-text">ANCALAGON</span>
      </a>
      <ul class="nav-links">
        <li><a href="/visage/" class="nav-link">VISAGE</a></li>
        <li><a href="/sentience/" class="nav-link">SENTIENCE</a></li>
        <li><a href="/research/" class="nav-link">RESEARCH</a></li>
        <li><a href="/company/" class="nav-link">Company</a></li>
      </ul>
      <a href="/contact/" class="nav-cta">Contact Us ↗</a>
      <button class="nav-hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu">
    <ul>
      <li><a href="/visage/" class="mob-link">VISAGE</a></li>
      <li><a href="/sentience/" class="mob-link">SENTIENCE</a></li>
      <li><a href="/research/" class="mob-link">RESEARCH</a></li>
      <li><a href="/company/" class="mob-link">Company</a></li>
      <li><a href="/contact/" class="mob-link">Contact</a></li>
    </ul>
  </div>

  <!-- ═══════════ HERO ═══════════ -->
  <section class="hero">
    <div class="hero-video-wrap">
      <video class="hero-video" src="media/render.mp4" autoplay muted loop playsinline></video>
      <div class="hero-overlay"></div>
    </div>
    <div class="hero-content" style="padding-bottom: 2rem;">
      <h1 class="hero-headline typewriter-text fade-in-up delay-1">
        Building Autonomous<br /> Emotional Intelligence
      </h1>
      <p class="hero-sub typewriter-text fade-in-up delay-2">
        Advanced robotics, embodied AI,<br />and real-world autonomy
      </p>
      <div class="hero-actions fade-in-up delay-3">
        <a href="/visage/" class="btn-primary">Explore VISAGE</a>
        <a href="/research/" class="btn-ghost">View Research ↗</a>
      </div>
    </div>
    <a href="#" class="hero-full-video" onclick="openVideoModal(event)">Full Video ↗</a>
  </section>

  <!-- VIDEO MODAL -->
  <div class="video-modal" id="video-modal">
    <div class="modal-backdrop" onclick="closeVideoModal()"></div>
    <div class="modal-content">
      <button class="modal-close" onclick="closeVideoModal()">✕</button>
      <video id="modal-video" src="media/render.mp4" controls class="modal-video"></video>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
